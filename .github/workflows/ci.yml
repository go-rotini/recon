name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: go-rotini/.github/.github/workflows/go-ci.yml@main
    with:
      jobs: |
        - name: test
          run: make test
          os: [ubuntu-latest, macos-latest, windows-latest]
          artifact: test.out
        - name: vet-32bit
          run: |
            GOOS=linux GOARCH=386 go vet ./...
            GOOS=linux GOARCH=arm go vet ./...
        - name: acceptance
          run: make test-acceptance
        - name: lint
          run: make lint
        - name: fuzz
          run: make test-fuzz
        - name: benchmark
          run: make test-bench
          artifact: test_bench.out
        - name: race
          run: make test-race
          os: [ubuntu-latest, macos-latest, windows-latest]
